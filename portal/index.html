<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal PCP · Medicinal</title>
<style>
  html,body{margin:0;background:#f2f4f7;color:#111a24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #pcpCarregando{max-width:420px;margin:20vh auto;text-align:center;font-size:15px;color:#5d6b7a}
</style>
</head>
<body>
<div id="pcpCarregando">Carregando o Portal PCP…</div>
<script>
/* Casca do Portal PCP para hospedagem estática (Infalltech / CloudPanel).
   O app em si fica no Supabase formulaCerta (_brasa_parts_pcp) e é servido por brasa_loader_pcp():
   para atualizar o portal, publica-se só no banco; este arquivo não muda. */
(function(){
  var API  = 'https://mwhlnlqxtudcgbggkqud.supabase.co';
  var ANON = [
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ',
    'pc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13aGxubHF',
    '4dHVkY2diZ2drcXVkIiwicm9sZSI6ImFub24iLCJ',
    'pYXQiOjE3ODQ2NjYyNDgsImV4cCI6MjEwMDI0MjI',
    '0OH0.awJmlZnBy4RpTMr1lfL4uIKXmKwm7ItzR9W',
    '42BAZRnc'
  ].join('').replace(/[^A-Za-z0-9._-]/g, '');
  var aviso = document.getElementById('pcpCarregando');
  fetch(API + '/rest/v1/rpc/brasa_loader_pcp', {
    method: 'POST',
    headers: {'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json'},
    body: '{}'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    var scripts = Array.prototype.slice.call(box.querySelectorAll('script'));
    scripts.forEach(function(s){ s.parentNode.removeChild(s); });
    aviso.remove();
    while(box.firstChild) document.body.appendChild(box.firstChild);
    scripts.forEach(function(s){
      var n = document.createElement('script');
      n.textContent = s.textContent;
      document.body.appendChild(n);
    });
  }).catch(function(e){
    aviso.textContent = 'Não foi possível carregar o Portal PCP (' + e.message + '). Atualize a página em alguns instantes.';
  });
})();
</script>
</body>
</html>
